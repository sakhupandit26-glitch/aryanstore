<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aryan profit 👑</title>
<meta name="theme-color" content="#07111f">
<style>
:root{
  --bg:#07111f; --bg2:#0f2542; --gold:#f5c542; --gold2:#ffe9a0; --gold3:#b8860b;
  --text:#f6efe0; --muted:#a79fb5; --line:rgba(245,197,66,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--text);
  font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(245,197,66,.12),transparent 70%),
    radial-gradient(ellipse 70% 45% at 50% 100%,rgba(40,110,200,.28),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  display:flex;align-items:center;justify-content:center;
}
main{width:100%;max-width:440px;padding:28px 22px 24px;text-align:center;display:flex;flex-direction:column;align-items:center}
.crest{position:relative;width:230px;height:230px;display:grid;place-items:center;margin-bottom:22px}
.ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--gold3),var(--gold2),var(--gold),var(--gold3),var(--gold2),var(--gold3));
  animation:spin 9s linear infinite;
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);
  filter:drop-shadow(0 0 14px rgba(245,197,66,.55))}
.photo{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 22px rgba(245,197,66,.45)}
h1{margin:0;font-size:clamp(2.1rem,9.5vw,2.8rem);font-weight:800;line-height:1.05;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:12px 0 28px;font-size:1.02rem;color:var(--text);letter-spacing:.04em}
.join{
  display:block;width:100%;max-width:340px;padding:17px 24px;border-radius:999px;
  font:700 1.1rem/1 inherit;font-family:inherit;color:#1a0f00;text-decoration:none;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));
  box-shadow:0 8px 26px rgba(245,197,66,.35),inset 0 1px 0 rgba(255,255,255,.55);
  animation:blink 1.1s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}
.join:active{transform:scale(.97)}
.join:focus-visible,.ad:focus-visible{outline:3px solid #fff;outline-offset:3px}
.note{margin:26px 0 18px;max-width:360px;font-size:.78rem;line-height:1.6;color:var(--muted)}
.ad{display:inline-block;padding:9px 20px;border-radius:999px;border:1px solid var(--line);
  color:var(--gold2);font-size:.85rem;text-decoration:none;background:rgba(255,255,255,.03)}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.035)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring,.join{animation:none}}
@media (max-height:640px){.crest{width:150px;height:150px;margin-bottom:14px}.note{margin:18px 0 14px}}
</style>

<body>
<main>
  <div class="crest">
    <div class="ring"></div>

  <h1>Aryan Profit 👑</h1>
